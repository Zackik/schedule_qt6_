name: Release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
jobs:
  build-and-release:
    name: Build & Release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        modules: 'qtnetworkauth qtmultimedia qtdeclarative qttools'
    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
    - name: Build Project
      run: cmake --build build --config Release --parallel 2
    - name: Run Tests
      working-directory: ./build
      run: ctest -C Release --output-on-failure
    - name: Package with CPack
      working-directory: ./build
      run: cpack -C Release
    - name: Upload Windows MSI Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: SmartSchedule-Windows-Installer
        path: build/*.msi
    - name: Upload macOS DMG Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: SmartSchedule-macOS-Installer
        path: build/*.dmg
    - name: Upload Linux DEB Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: SmartSchedule-Linux-Installer
        path: build/*.deb

  publish:
    name: Publish Release
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Download Windows Installer
      uses: actions/download-artifact@v4
      with:
        name: SmartSchedule-Windows-Installer
        path: dist/
    - name: Download macOS Installer
      uses: actions/download-artifact@v4
      with:
        name: SmartSchedule-macOS-Installer
        path: dist/
    - name: Download Linux Installer
      uses: actions/download-artifact@v4
      with:
        name: SmartSchedule-Linux-Installer
        path: dist/
    - name: Generate Checksums
      run: |
        cd dist
        sha256sum * > ../SHA256SUMS.txt
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*
          SHA256SUMS.txt
        generate_release_notes: true
