name: CI
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
permissions:
  contents: read
env:
  BUILD_TYPE: Release
jobs:
  build-and-test:
    name: Build & Test on Ubuntu
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ qt6-base-dev qt6-declarative-dev qt6-multimedia-dev libqt6networkauth6-dev qt6-l10n-tools qt6-tools-dev qt6-tools-dev-tools clang-tidy clang-format ninja-build libgl1-mesa-dev
    - name: Check Formatting
      run: |
        find src tests -type f \( -name "*.cpp" -o -name "*.h" \) | xargs clang-format --dry-run --Werror
    - name: Configure CMake
      run: cmake --preset ci-ubuntu
    - name: Build
      run: cmake --build --preset ci-ubuntu
    - name: Run Tests
      run: ctest --preset ci-ubuntu --output-on-failure
